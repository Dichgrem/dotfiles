# Compact single-line footer — clean, no emoji.
format = """
$directory\
$git_branch\
[ · ](dim)\
$model\
$thinking\
[ · ](dim)\
$context\
$tokens\
$cost\
$extension_status"""
palette = "tokyo-night"

[directory]
symbol = ""
style = "fg:directory_fg bg:directory"

[git_branch]
symbol = ""
style = "fg:git_fg bg:git"

[model]
symbol = ""
style = "fg:git_fg bg:git"

[thinking]
symbol = ""
style = "fg:git_fg bg:git"

[context]
symbol = ""
style = "fg:runtime_fg bg:runtime"

[tokens]
symbol = ""
style = "fg:runtime_fg bg:runtime"

[cost]
symbol = ""
style = "fg:meter_fg bg:meter"

[extension_status]
symbol = ""
style = "fg:extension"

[palettes.tokyo-night]
lead = "#a3aed2"
header = "#a3aed2"
header_fg = "#090c0c"
directory = "#769ff0"
directory_fg = "#e3e5e5"
git = "#394260"
git_fg = "#769ff0"
runtime = "#212736"
runtime_fg = "#769ff0"
meter = "#1d2230"
meter_fg = "#a0a9cb"
extension = "#a0a9cb"
